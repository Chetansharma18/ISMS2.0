<section id="about"
  class="w-full bg-white py-10 sm:py-14 lg:py-16 px-4 sm:px-6 lg:px-8 border-t border-slate-200/80 select-none"
  aria-label="About ISMS">
  <div class="max-w-[1400px] mx-auto">

    <!-- 2-Column Layout Matching User Reference -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center">

      <!-- Left Column: Department Context, RFP Content & Action -->
      <div class="flex flex-col justify-center text-left">

        <!-- Main Heading -->
        <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-[#002244] tracking-tight">
          {{ t().about.heading }}
        </h2>
        <!-- Orange accent line below heading -->
        <div class="w-12 h-1 bg-[#ea580c] rounded-full mt-2.5 mb-5"></div>

        <!-- RFP Paragraph 1 -->
        <p class="text-slate-600 text-sm sm:text-[14.5px] leading-relaxed mb-3.5">
          {{ t().about.p1 }}
        </p>

        <!-- RFP Paragraph 2 -->
        <p class="text-slate-600 text-sm sm:text-[14.5px] leading-relaxed mb-6">
          {{ t().about.p2 }}
        </p>

        <!-- Action Button: [ Know More -> ] -->
        <div>
          <a href="#services"
            class="px-5 py-2.5 rounded-md bg-[#002244] hover:bg-[#003366] text-white text-xs sm:text-[13px] font-semibold tracking-wide shadow-xs transition inline-flex items-center gap-2">
            <span>{{ t().about.knowMore }}</span>
            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </a>
        </div>

      </div>

      <!-- Right Column: Card with Lab Training Photo & RFP Quote -->
      <div class="bg-[#f0f6ff] rounded-xl border border-blue-200/80 shadow-2xs overflow-hidden flex flex-col">

        <!-- Computer Lab Classroom Training Photo -->
        <div class="w-full h-48 sm:h-56 lg:h-60 overflow-hidden border-b border-blue-200/60 relative">
          <img src="about-lab-training.jpg" alt="Rajasthan Government Skill Development Center - Classroom Training"
            class="w-full h-full object-cover object-center" />
        </div>

        <!-- Content Area: Blue Quote Icon & Text -->
        <div class="p-5 sm:p-6 flex items-start gap-3.5">
          <!-- Quote Icon in Bright Blue -->
          <svg class="w-5 h-5 sm:w-6 sm:h-6 text-blue-600 shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z" />
          </svg>
          <p class="text-slate-700 text-xs sm:text-[13.5px] leading-relaxed font-medium">
            {{ t().about.quote }}
          </p>
        </div>

      </div>

    </div>

    <!-- RFP-supported Statistics & Heritage Banner (Continuation of About Section) -->
    <div
      class="mt-4 sm:mt-5 lg:mt-6 rounded-2xl bg-gradient-to-r from-[#feeade] via-[#fcf4ec] to-[#fcf4ec] border border-[#fae2ce] shadow-xs overflow-hidden">
      <div class="flex flex-col lg:flex-row items-stretch justify-between">

        <!-- LEFT Side: Heritage Palace Artwork with 'Building a Skilled Rajasthan' -->
        <div
          class="w-full lg:w-[45%] xl:w-[43%] flex items-center justify-center shrink-0 overflow-hidden bg-transparent">
          <img src="banner-left-part.png" alt="Building a Skilled Rajasthan - Heritage Architecture"
            class="w-full h-full object-cover object-left max-h-[160px] sm:max-h-[180px] lg:max-h-[190px]" />
        </div>

        <!-- RIGHT Side: RFP-supported Statistics -->
        <div class="w-full lg:w-[55%] xl:w-[57%] p-4 sm:p-6 flex flex-col justify-between">

          <!-- 3 Statistics Row with Vertical Dividers -->
          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-around gap-3 sm:gap-2 my-auto">

            <!-- Thin Vertical Divider before Stat 1 on desktop -->
            <div class="hidden lg:block w-px h-16 bg-slate-300/80 -ml-2"></div>

            <!-- Metric 1: 16 Official RFP Modules -->
            <div class="flex items-center gap-3.5 px-3 py-1.5 sm:py-0 border-b sm:border-b-0 border-amber-200/60">
              <img src="stat-icon-1.png" alt="Official RFP Modules"
                class="w-9 h-9 sm:w-11 sm:h-11 object-contain shrink-0" />
              <div>
                <div
                  class="text-2xl sm:text-3xl lg:text-[32px] font-black text-[#002244] tracking-tight leading-none mb-1">
                  16
                </div>
                <div class="text-xs sm:text-[12.5px] font-semibold text-slate-600 leading-tight">
                  {{ t().about.stat1Label }}
                </div>
              </div>
            </div>

            <!-- Vertical Divider 1 -->
            <div class="hidden sm:block w-px h-16 bg-slate-300/80"></div>

            <!-- Metric 2: 6.0L+ Candidates -->
            <div class="flex items-center gap-3.5 px-3 py-1.5 sm:py-0 border-b sm:border-b-0 border-amber-200/60">
              <img src="stat-icon-2.png" alt="Candidates" class="w-9 h-9 sm:w-11 sm:h-11 object-contain shrink-0" />
              <div>
                <div
                  class="text-2xl sm:text-3xl lg:text-[32px] font-black text-[#002244] tracking-tight leading-none mb-1">
                  6.0L+
                </div>
                <div class="text-xs sm:text-[12.5px] font-semibold text-slate-600 leading-tight">
                  {{ t().about.stat2Label }}
                </div>
              </div>
            </div>

            <!-- Vertical Divider 2 -->
            <div class="hidden sm:block w-px h-16 bg-slate-300/80"></div>

            <!-- Metric 3: 2,670+ Training Partners -->
            <div class="flex items-center gap-3.5 px-3 py-1.5 sm:py-0">
              <img src="stat-icon-3.png" alt="Training Partners"
                class="w-9 h-9 sm:w-11 sm:h-11 object-contain shrink-0" />
              <div>
                <div
                  class="text-2xl sm:text-3xl lg:text-[32px] font-black text-[#002244] tracking-tight leading-none mb-1">
                  2,670+
                </div>
                <div class="text-xs sm:text-[12.5px] font-semibold text-slate-600 leading-tight">
                  {{ t().about.stat3Label }}
                </div>
              </div>
            </div>

          </div>

          <!-- Bottom-Right: RFP Baseline (March 2025) -->
          <div class="text-center sm:text-right pt-2.5 sm:pt-3 pr-0 sm:pr-2">
            <span class="text-[10.5px] sm:text-xs font-normal text-slate-500">
              {{ t().about.baseline }}
            </span>
          </div>

        </div>

      </div>
    </div>

  </div>
</section>
