<div class="relative w-full" [class.z-40]="isOpen()">
  <button type="button" (click)="toggle($event)" [disabled]="disabled"
    [attr.aria-expanded]="isOpen()" [attr.aria-label]="placeholder"
    class="w-full h-9 px-2.5 border rounded-md text-sm text-left flex items-center justify-between transition outline-none cursor-pointer shadow-2xs"
    [ngClass]="[
      disabled ? 'bg-slate-100 text-slate-400 cursor-not-allowed border-slate-200' : 'bg-white',
      isInvalid
        ? 'border-rose-400 focus:border-rose-500 focus:ring-1 focus:ring-rose-500/20 bg-rose-50/20'
        : 'border-slate-300 hover:border-slate-400 focus:border-blue-900 focus:ring-1 focus:ring-blue-900/20'
    ]">
    <span class="truncate text-xs sm:text-sm"
      [ngClass]="value ? 'text-slate-800 font-medium' : 'text-slate-400'">
      {{ value || placeholder }}
    </span>
    <div class="flex items-center gap-1 shrink-0 ml-1.5">
      @if (value && !disabled) {
      <span (click)="clear($event)" title="Clear selection"
        class="w-4 h-4 rounded-full hover:bg-slate-200 text-slate-400 hover:text-slate-700 flex items-center justify-center text-xs transition cursor-pointer">
        ✕
      </span>
      }
      <svg class="w-4 h-4 text-slate-400 transition-transform duration-200"
        [class.rotate-180]="isOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </button>

  @if (isOpen()) {
  <div
    class="absolute top-full left-0 mt-1 w-full min-w-[240px] bg-white rounded-lg border border-slate-200 shadow-2xl z-50 overflow-hidden text-sm ring-1 ring-black/5"
    (click)="$event.stopPropagation()">
    <!-- Search Input Header -->
    <div class="p-2 border-b border-slate-100 bg-slate-50/90 sticky top-0 z-10">
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 pointer-events-none text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input [id]="dropdownId + '-search-input'" type="text" [placeholder]="searchPlaceholder"
          [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)"
          class="w-full h-8 pl-8 pr-7 text-xs bg-white border border-slate-200 rounded-md text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-900 focus:ring-1 focus:ring-blue-900/20 transition" />
        @if (searchQuery()) {
        <button type="button" (click)="searchQuery.set('')"
          class="absolute inset-y-0 right-0 pr-2 flex items-center text-slate-400 hover:text-slate-600 text-xs">
          ✕
        </button>
        }
      </div>
    </div>

    <!-- Scrollable Items List -->
    <div class="dropdown-menu-scroll py-1 divide-y divide-slate-50">
      @for (item of filteredItems(); track item) {
      <button type="button" (click)="selectItem(item)"
        class="w-full px-3 py-1.5 text-left text-xs sm:text-sm flex items-center justify-between transition-colors cursor-pointer"
        [ngClass]="value === item ? 'bg-blue-50 text-blue-900 font-semibold' : 'text-slate-700 hover:bg-slate-100'">
        <span>{{ item }}</span>
        @if (value === item) {
        <svg class="w-4 h-4 text-blue-900 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
        }
      </button>
      } @empty {
      <div class="px-3 py-4 text-center text-xs text-slate-400">
        {{ emptyText }}
      </div>
      }
    </div>
  </div>
  }
</div>
