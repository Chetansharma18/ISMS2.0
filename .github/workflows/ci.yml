name: CI

# Runs on every pull request and on every push except the deploy branch (deploy.yml checks that one).
# Make this check "required" in the repository settings (branch protection) so nothing merges red.
on:
  pull_request:
  push:
    branches-ignore:
      - Production

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production build
        run: npm run build
