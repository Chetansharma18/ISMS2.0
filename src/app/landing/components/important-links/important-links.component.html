<section id="important-links"
  class="relative w-full bg-[#001f3f] border-t-2 border-amber-500/30 border-b border-[#001730] py-6 sm:py-8 lg:py-7 select-none overflow-hidden"
  (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
  <!-- Background Glow & Subtle Motif -->
  <div class="absolute inset-0 bg-radial from-blue-900/20 via-transparent to-transparent pointer-events-none"></div>

  <div class="max-w-[1400px] mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <!-- Header with decorative horizontal lines -->
    <div class="flex items-center justify-center gap-3 sm:gap-6 mb-6 sm:mb-7">
      <div
        class="h-[1.5px] flex-1 max-w-[80px] sm:max-w-[160px] md:max-w-[220px] bg-gradient-to-r from-transparent via-amber-400/60 to-amber-400">
      </div>
      <h3 class="text-base sm:text-xl lg:text-2xl font-bold text-white tracking-wide text-center">
        {{ t().importantLinks.heading }}
      </h3>
      <div
        class="h-[1.5px] flex-1 max-w-[80px] sm:max-w-[160px] md:max-w-[220px] bg-gradient-to-l from-transparent via-amber-400/60 to-amber-400">
      </div>
    </div>

    <!-- Carousel Container with Side Navigation Arrows -->
    <div class="relative flex items-center justify-center max-w-[1400px] w-full mx-auto px-8 sm:px-12">
      <!-- Prev Arrow Button -->
      <button type="button" (click)="prev()" [attr.aria-label]="t().importantLinks.prevAria"
        class="absolute left-0 sm:left-1 z-20 w-7 h-7 sm:w-10 sm:h-10 rounded-full bg-white/20 hover:bg-amber-400 text-white hover:text-slate-950 flex items-center justify-center backdrop-blur-md border border-white/30 hover:border-amber-400 shadow-lg transition-all duration-200 cursor-pointer active:scale-95">
        <svg class="w-3.5 h-3.5 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
      </button>

      <!-- Slider Viewport (Exact clipping) -->
      <div class="w-full overflow-hidden py-2">
        <div class="flex transition-transform duration-500 ease-in-out"
          [style.transform]="'translateX(-' + (currentIndex() * (100 / itemsPerPage())) + '%)'">
          @for (item of links; track item.id) {
          <div class="shrink-0 px-1.5 sm:px-2.5 md:px-3" [style.width]="(100 / itemsPerPage()) + '%'">
            <a [href]="item.url" target="_blank" rel="noopener noreferrer"
              [title]="item.name + (item.tagline ? ' - ' + item.tagline : '')"
              class="bg-white rounded-xl sm:rounded-2xl shadow-md hover:shadow-xl border border-slate-100 hover:border-amber-400 p-2 sm:p-3 flex items-center justify-center h-28 sm:h-36 lg:h-44 transition-all duration-300 hover:-translate-y-1 hover:scale-[1.02] cursor-pointer group">
              <img [src]="item.logo" [alt]="item.name"
                (error)="onImageError($event, item.logo.split('/').pop() || '')"
                class="max-h-[88%] sm:max-h-[92%] w-auto max-w-[95%] object-contain select-none transition-transform duration-300 group-hover:scale-105 filter drop-shadow-sm" />
            </a>
          </div>
          }
        </div>
      </div>

      <!-- Next Arrow Button -->
      <button type="button" (click)="next()" [attr.aria-label]="t().importantLinks.nextAria"
        class="absolute right-0 sm:right-1 z-20 w-7 h-7 sm:w-10 sm:h-10 rounded-full bg-white/20 hover:bg-amber-400 text-white hover:text-slate-950 flex items-center justify-center backdrop-blur-md border border-white/30 hover:border-amber-400 shadow-lg transition-all duration-200 cursor-pointer active:scale-95">
        <svg class="w-3.5 h-3.5 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>

    <!-- Pagination Dots -->
    <div class="flex items-center justify-center gap-2 mt-4 sm:mt-5">
      @for (dotIdx of dotsArray(); track dotIdx) {
      <button type="button" (click)="goToSlide(dotIdx)" [attr.aria-label]="'Go to slide ' + (dotIdx + 1)"
        class="transition-all duration-300 rounded-full cursor-pointer"
        [ngClass]="currentIndex() === dotIdx ? 'w-6 h-2 bg-amber-400 shadow-sm' : 'w-2 h-2 bg-white/40 hover:bg-white/80'"></button>
      }
    </div>
  </div>
</section>
