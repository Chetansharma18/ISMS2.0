<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
  <!-- State Emblem of India (Lion Capital of Ashoka) -->
  <g fill="#1F2937">
    <!-- Center Lion Head & Mane -->
    <path d="M50 10 C44 10 39 14 39 21 C39 26 42 30 44 33 C42 35 40 38 40 43 C40 48 43 51 45 54 L45 58 C43 60 41 63 41 67 L59 67 C59 63 57 60 55 58 L55 54 C57 51 60 48 60 43 C60 38 58 35 56 33 C58 30 61 26 61 21 C61 14 56 10 50 10 Z"/>
    <circle cx="50" cy="18" r="3" fill="#FFFFFF"/>
    <circle cx="46" cy="24" r="1.5" fill="#FFFFFF"/>
    <circle cx="54" cy="24" r="1.5" fill="#FFFFFF"/>
    <!-- Center Lion Muzzle -->
    <ellipse cx="50" cy="30" rx="3.5" ry="2.5" fill="#FFFFFF"/>
    <circle cx="50" cy="29" r="1.2" fill="#1F2937"/>
    
    <!-- Left Lion Profile -->
    <path d="M38 18 C33 18 29 22 28 27 C27 32 29 36 32 39 C30 42 29 46 30 50 C31 54 34 57 37 60 L39 67 L42 67 C41 62 38 59 38 54 C38 49 40 45 39 40 C37 37 36 33 36 29 C36 25 38 21 40 19 Z"/>
    <circle cx="33" cy="26" r="1.5" fill="#FFFFFF"/>
    
    <!-- Right Lion Profile -->
    <path d="M62 18 C67 18 71 22 72 27 C73 32 71 36 68 39 C70 42 71 46 70 50 C69 54 66 57 63 60 L61 67 L58 67 C59 62 62 59 62 54 C62 49 60 45 61 40 C63 37 64 33 64 29 C64 25 62 21 60 19 Z"/>
    <circle cx="67" cy="26" r="1.5" fill="#FFFFFF"/>

    <!-- Pedestal / Abacus Top Rim -->
    <rect x="22" y="68" width="56" height="4" rx="1.5"/>
    
    <!-- Abacus Mid Section with Ashoka Chakra -->
    <rect x="24" y="73" width="52" height="15" rx="1" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.5"/>
    <!-- Ashoka Chakra (Wheel of Law) Center -->
    <circle cx="50" cy="80.5" r="6" fill="#FFFFFF" stroke="#0A2540" stroke-width="1.2"/>
    <circle cx="50" cy="80.5" r="1.2" fill="#0A2540"/>
    <!-- Chakra Spokes -->
    <path d="M50 75 L50 86 M45 80.5 L55 80.5 M46.5 77 L53.5 84 M46.5 84 L53.5 77" stroke="#0A2540" stroke-width="0.8"/>
    <!-- Left Bull Figure Silhouette -->
    <path d="M30 78 C31 76 34 76 36 78 C37 80 36 83 34 83 C32 83 29 81 30 78 Z" fill="#1F2937"/>
    <!-- Right Galloping Horse Silhouette -->
    <path d="M70 78 C69 76 66 76 64 78 C63 80 64 83 66 83 C68 83 71 81 70 78 Z" fill="#1F2937"/>

    <!-- Pedestal Base (Lotus Base) -->
    <path d="M20 89 C20 89 30 94 50 94 C70 94 80 89 80 89 L78 95 C68 97 58 97 50 97 C42 97 32 97 22 95 Z"/>
    <rect x="18" y="96" width="64" height="3" rx="1"/>
  </g>

  <!-- Satyameva Jayate (सत्यमेव जयते) in Devanagari Script -->
  <text x="50" y="112" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#0A2540" letter-spacing="0.5">सत्यमेव जयते</text>
  
  <!-- BHARAT SARKAR / GOVT OF INDIA -->
  <text x="50" y="123" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#4B5563" letter-spacing="0.5">भारत सरकार</text>
</svg>
