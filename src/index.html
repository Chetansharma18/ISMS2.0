<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>ISMS2.0</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- ====================================================================
       POST Request Payload Modal & Interception Styles
       ==================================================================== -->
  <style>
    #post-payload-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      animation: postModalFadeIn 0.2s ease-out;
    }
    #post-payload-modal-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: postModalSlideUp 0.25s ease-out;
    }
    @keyframes postModalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes postModalSlideUp {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .post-modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8fafc;
    }
    .post-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .post-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.15s ease;
      line-height: 1;
    }
    .post-close-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .post-modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }
    .post-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 10px;
      font-size: 12px;
      color: #475569;
    }
    .post-tab-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .post-tab-btn {
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .post-tab-btn.active {
      background: #0B3558;
      color: #ffffff;
    }
    .post-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .post-table th {
      text-align: left;
      padding: 8px 12px;
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .post-table td {
      padding: 8px 12px;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      vertical-align: top;
      word-break: break-word;
    }
    .post-table td.key-col {
      font-weight: 600;
      color: #0B3558;
      width: 32%;
      background: #fafafa;
    }
    .post-raw-box {
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      overflow-x: auto;
      max-height: 340px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
    .post-modal-footer {
      padding: 14px 20px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      background: #f8fafc;
    }
    .post-btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .post-btn-secondary {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }
    .post-btn-secondary:hover {
      background: #f1f5f9;
    }
    .post-btn-primary {
      background: #0B3558;
      color: #ffffff;
    }
    .post-btn-primary:hover {
      background: #082842;
    }
  </style>
</head>

<body>
  <app-root></app-root>

  <!-- ====================================================================
       Incoming POST Payload Display Modal
       ==================================================================== -->
  <div id="post-payload-modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="post-modal-title">
    <div id="post-payload-modal-card">
      <div class="post-modal-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="post-badge">POST Payload</span>
          <h3 id="post-modal-title" style="margin: 0; font-size: 16px; font-weight: 700; color: #0f172a;">
            Incoming Request Data
          </h3>
        </div>
        <button type="button" class="post-close-btn" id="post-modal-close-icon" aria-label="Close modal">&times;</button>
      </div>

      <div class="post-modal-body">
        <div class="post-meta-row">
          <div><strong>Source:</strong> <span id="post-meta-source">HTTP POST</span></div>
          <div><strong>Received:</strong> <span id="post-meta-time">Just now</span></div>
        </div>

        <div class="post-tab-nav">
          <button type="button" class="post-tab-btn active" id="post-tab-table">Structured Table</button>
          <button type="button" class="post-tab-btn" id="post-tab-raw">Raw JSON</button>
        </div>

        <div id="post-view-table">
          <table class="post-table">
            <thead>
              <tr>
                <th style="width: 35%;">Parameter / Field</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody id="post-table-tbody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>

        <div id="post-view-raw" style="display: none;">
          <pre class="post-raw-box" id="post-raw-pre"></pre>
        </div>
      </div>

      <div class="post-modal-footer">
        <button type="button" class="post-btn post-btn-secondary" id="post-btn-copy">
          <span id="post-copy-text">Copy JSON</span>
        </button>
        <button type="button" class="post-btn post-btn-primary" id="post-btn-close">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- ====================================================================
       POST Request Payload Interceptor & Handler Script
       ==================================================================== -->
  <script>
    (function () {
      let currentPayloadData = null;

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatValue(val) {
        if (val === null || val === undefined) return '<span style="color:#94a3b8;">(empty)</span>';
        if (typeof val === 'object') {
          return '<pre style="margin:0;font-size:11.5px;white-space:pre-wrap;font-family:monospace;">' +
            escapeHtml(JSON.stringify(val, null, 2)) + '</pre>';
        }
        return escapeHtml(String(val));
      }

      function openModal(payload, source) {
        if (!payload) return;
        currentPayloadData = payload;
        window.__LAST_POST_PAYLOAD__ = payload;

        // Populate metadata
        const sourceEl = document.getElementById('post-meta-source');
        const timeEl = document.getElementById('post-meta-time');
        if (sourceEl) sourceEl.textContent = source || 'POST Request';
        if (timeEl) timeEl.textContent = new Date().toLocaleTimeString();

        // Populate Table View
        const tbody = document.getElementById('post-table-tbody');
        if (tbody) {
          tbody.innerHTML = '';
          const entries = (typeof payload === 'object' && payload !== null)
            ? Object.entries(payload)
            : [['payload', payload]];

          if (entries.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#64748b;padding:16px;">No payload fields found.</td></tr>';
          } else {
            entries.forEach(function (pair) {
              const key = pair[0];
              const val = pair[1];
              const tr = document.createElement('tr');
              tr.innerHTML = '<td class="key-col">' + escapeHtml(key) + '</td><td>' + formatValue(val) + '</td>';
              tbody.appendChild(tr);
            });
          }
        }

        // Populate Raw JSON View
        const rawPre = document.getElementById('post-raw-pre');
        if (rawPre) {
          rawPre.textContent = (typeof payload === 'object' && payload !== null)
            ? JSON.stringify(payload, null, 2)
            : String(payload);
        }

        // Default to Table view
        showTab('table');

        // Show Modal
        const backdrop = document.getElementById('post-payload-modal-backdrop');
        if (backdrop) {
          backdrop.style.display = 'flex';
        }

        // Dispatch Custom DOM Event for any listening Angular components / services
        try {
          document.dispatchEvent(new CustomEvent('isms:post-payload', {
            detail: { payload: payload, source: source }
          }));
        } catch (e) {}
      }

      function closeModal() {
        const backdrop = document.getElementById('post-payload-modal-backdrop');
        if (backdrop) {
          backdrop.style.display = 'none';
        }
      }

      function showTab(tab) {
        const tableBtn = document.getElementById('post-tab-table');
        const rawBtn = document.getElementById('post-tab-raw');
        const tableView = document.getElementById('post-view-table');
        const rawView = document.getElementById('post-view-raw');

        if (tab === 'table') {
          if (tableBtn) tableBtn.classList.add('active');
          if (rawBtn) rawBtn.classList.remove('active');
          if (tableView) tableView.style.display = 'block';
          if (rawView) rawView.style.display = 'none';
        } else {
          if (tableBtn) tableBtn.classList.remove('active');
          if (rawBtn) rawBtn.classList.add('active');
          if (tableView) tableView.style.display = 'none';
          if (rawView) rawView.style.display = 'block';
        }
      }

      // Expose globally for browser console testing, automated tests & integration
      window.showPostModal = openModal;
      window.closePostModal = closeModal;

      // Initialize event handlers on load
      function initModalEvents() {
        const closeIcon = document.getElementById('post-modal-close-icon');
        const closeBtn = document.getElementById('post-btn-close');
        const backdrop = document.getElementById('post-payload-modal-backdrop');
        const tableBtn = document.getElementById('post-tab-table');
        const rawBtn = document.getElementById('post-tab-raw');
        const copyBtn = document.getElementById('post-btn-copy');

        if (closeIcon) closeIcon.addEventListener('click', closeModal);
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (backdrop) {
          backdrop.addEventListener('click', function (e) {
            if (e.target === backdrop) closeModal();
          });
        }
        if (tableBtn) tableBtn.addEventListener('click', function () { showTab('table'); });
        if (rawBtn) rawBtn.addEventListener('click', function () { showTab('raw'); });

        if (copyBtn) {
          copyBtn.addEventListener('click', function () {
            if (!currentPayloadData) return;
            const text = typeof currentPayloadData === 'object'
              ? JSON.stringify(currentPayloadData, null, 2)
              : String(currentPayloadData);
            if (navigator.clipboard) {
              navigator.clipboard.writeText(text).then(function () {
                const copyText = document.getElementById('post-copy-text');
                if (copyText) {
                  copyText.textContent = 'Copied!';
                  setTimeout(function () { copyText.textContent = 'Copy JSON'; }, 2000);
                }
              });
            }
          });
        }

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeModal();
        });

        // 1. Check for Service Worker cached POST payload
        if ('caches' in window) {
          caches.open('post-payload-store-v1').then(function (cache) {
            return cache.match('/__post_payload__');
          }).then(function (response) {
            if (response) {
              return response.json().then(function (data) {
                caches.open('post-payload-store-v1').then(function (cache) {
                  cache.delete('/__post_payload__');
                });
                if (data && data.payload) {
                  openModal(data.payload, data.source || 'HTTP POST Request');
                }
              });
            }
          }).catch(function () {});
        }

        // 2. Check for Server-Injected Script or Inputs
        const injectedScript = document.getElementById('post-payload') || document.getElementById('sso-payload');
        if (injectedScript && injectedScript.textContent) {
          try {
            const data = JSON.parse(injectedScript.textContent.trim());
            openModal(data, 'Server Injected POST Data');
          } catch (e) {}
        }

        // 3. Check for Global Window Variables
        if (window.__POST_DATA__) {
          openModal(window.__POST_DATA__, 'Window Injected POST Data');
        } else if (window.__POST_PAYLOAD__) {
          openModal(window.__POST_PAYLOAD__, 'Window Injected POST Payload');
        }

        // 4. Check for Hidden Form Inputs (e.g. from an HTML form POST)
        const hiddenForm = document.getElementById('sso-post-form') || document.querySelector('form[data-post-payload]');
        if (hiddenForm) {
          const formData = new FormData(hiddenForm);
          const obj = {};
          formData.forEach(function (v, k) { obj[k] = v; });
          if (Object.keys(obj).length > 0) {
            openModal(obj, 'HTML Form Submission');
          }
        }

        // 5. Check URL parameters (?testPost=true or ?postData=...)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('testPost') === 'true' || window.location.hash === '#testPost') {
          openModal({
            SSOID: 'RAJ_GOV_TP_001',
            token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.sso_demo_token',
            userType: 'Training Partner',
            organisation: 'Rajasthan Skill Development Enterprise',
            department: 'RSLDC',
            role: 'existing_user',
            timestamp: new Date().toISOString()
          }, 'Test Simulation (?testPost=true)');
        } else if (urlParams.get('postData')) {
          try {
            const parsed = JSON.parse(decodeURIComponent(urlParams.get('postData')));
            openModal(parsed, 'URL Encoded POST Data');
          } catch (e) {}
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initModalEvents);
      } else {
        initModalEvents();
      }

      // 6. Listen for Service Worker broadcast messages
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'POST_PAYLOAD_RECEIVED') {
            openModal(event.data.payload, event.data.source || 'HTTP POST (Service Worker)');
          }
        });

        // Register Service Worker for POST request interception
        navigator.serviceWorker.register('/sw-post.js', { scope: '/' }).catch(function (err) {
          console.debug('[SW] sw-post.js registration not supported or failed:', err);
        });
      }

      // 7. Listen for window.postMessage from parent / opener / SSO iframe
      window.addEventListener('message', function (event) {
        if (!event.data || (typeof event.data === 'string' && event.data.startsWith('webpack'))) return;
        if (event.data && event.data.type === 'POST_PAYLOAD') {
          openModal(event.data.data || event.data.payload || event.data, 'window.postMessage');
        } else if (event.data && (event.data.ssoId || event.data.SSOID || event.data.token)) {
          openModal(event.data, 'SSO postMessage');
        }
      });
    })();
  </script>
</body>

</html>
